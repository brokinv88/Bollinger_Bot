name: Paper Auto-Trade (realtime SL checks)

on:
  schedule:
    # Chạy thêm trong ngày (mỗi 4h) để cập nhật SL + đóng lệnh chạm SL theo giá realtime.
    # 00:01 UTC đã được daily_scan.yml xử lý (scanner + auto_trade ban đầu).
    # 04/08/12/16/20 UTC = 11/15/19/23/03 giờ Việt Nam.
    - cron: '0 4,8,12,16,20 * * *'
  workflow_dispatch:

# Cấp quyền đọc và ghi trực tiếp từ trong file workflow
permissions:
  contents: write

jobs:
  auto-trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy python-telegram-bot ccxt python-dotenv tabulate

      - name: Run Paper Auto-Trade
        run: |
          python auto_trade.py

      - name: Regenerate Dashboard HTML
        run: |
          python generate_dashboard.py
          cp dashboard.html index.html

      - name: Commit and Push Updated Databases & Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add database_volume.db database_marketcap.db \
                  database_volume_stratb.db database_marketcap_stratb.db dashboard.html index.html
          git diff --staged --quiet || (git commit -m "Update portfolio databases [skip ci]" && git push origin main)