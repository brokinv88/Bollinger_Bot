name: Futures Auto-Trade (Paper + Bridge + Live SL)

on:
  schedule:
    # Chạy sau khi nến H4 futures đóng (5 phút). Đồng bộ giờ scan futures:
    #   04:05/08:05/12:05/16:05/20:05 UTC = 11:05/15:05/19:05/23:05/03:05 giờ Việt Nam.
    #   00:05 UTC (00:00 móc) do workflow này xử lý luôn (0,4,8,12,16,20).
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  futures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy python-telegram-bot

      # Bắt buộc các state file tin cậy từ commit trước (để vị thế persist qua runner).
      # Nếu thiếu (lần đầu), seed live_bridge từ paper state.
      - name: Seed Bridge (nếu chưa có)
        run: python live_bridge.py --seed

      - name: Live SL Monitor (realtime)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python futures_paper.py --monitor --notify

      - name: Paper Scan (H4 đã đóng)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python futures_paper.py --scan --notify

      - name: Bridge Scan (dry-run, log would-be orders)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python live_bridge.py --scan --notify

      - name: Regenerate Dashboard HTML
        run: |
          python generate_dashboard.py
          cp dashboard.html index.html

      - name: Commit and Push Updated State & Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add paper_state.json paper_trades.csv paper_equity.csv \
                  bridge_state.json bridge_trades.csv bridge_equity.csv bridge_orders.jsonl \
                  dashboard.html index.html
          git diff --staged --quiet || (git commit -m "Update futures paper+bridge state after H4 scan [skip ci]" && git push origin main)