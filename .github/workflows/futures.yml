name: Futures Auto-Trade (Paper + Bridge + Live SL)

on:
  schedule:
    # Chạy sau khi nến H4 futures đóng. Dùng :10 phút để không trùng giờ chạy
    # với auto_trade.yml (:05) — tránh 2 workflow push cùng lúc lên dashboard.html.
    #   04:10/08:10/12:10/16:10/20:10 UTC = 11:10/15:10/19:10/23:10/03:10 giờ Việt Nam.
    #   00:10 UTC (00:00 móc) do workflow này xử lý luôn (0,4,8,12,16,20).
    #   SL realtime giữa các móc do futures-monitor.yml lo (mỗi 30 phút).
    - cron: '10 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  futures:
    runs-on: ubuntu-latest
    concurrency:
      # Cùng group với daily_scan/auto_trade/futures-monitor: run sau CHỜ run trước
      # xong bước pull+push → không còn race push dashboard.html/state files.
      group: trading-git-push
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy python-telegram-bot

      # Bắt buộc các state file tin cậy từ commit trước (để vị thế persist qua runner).
      # Nếu thiếu (lần đầu), seed live_bridge từ paper state.
      - name: Seed Bridge (nếu chưa có)
        run: python live_bridge.py --seed

      - name: Live SL Monitor (realtime)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python futures_paper.py --monitor --notify

      - name: Paper Scan (H4 đã đóng)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python futures_paper.py --scan --notify

      - name: Bridge Scan (dry-run, log would-be orders)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python live_bridge.py --scan --notify

      - name: Regenerate Dashboard HTML
        run: |
          python generate_dashboard.py
          cp dashboard.html index.html

      - name: Commit and Push Updated State & Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # autostash giữ an toàn khi runner có unstaged thay đổi (scan vừa sửa equity)
          git pull --rebase --autostash origin main || true
          # Add các file có tồn tại (bridge_orders.jsonl có thể chưa có lần đầu)
          git add paper_state.json paper_trades.csv paper_equity.csv 2>/dev/null || true
          git add bridge_state.json bridge_trades.csv bridge_equity.csv bridge_orders.jsonl 2>/dev/null || true
          git add dashboard.html index.html 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update futures paper+bridge state after H4 scan [skip ci]" && git push origin main)