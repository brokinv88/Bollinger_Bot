name: Daily Crypto Portfolio Scanner

on:
  schedule:
    # Chạy lúc 00:01 UTC hàng ngày (tức 07:01 sáng giờ Việt Nam UTC+7)
    - cron: '1 0 * * *'
  # Cho phép bấm nút "Run workflow" bằng tay trên web GitHub bất cứ lúc nào
  workflow_dispatch:

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy python-telegram-bot ccxt python-dotenv tabulate

      - name: Run Daily Scanner
        run: |
          python daily_scanner.py

      - name: Commit and Push Updated Databases
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database_volume.db database_marketcap.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update portfolio databases [skip ci]" && git push)
