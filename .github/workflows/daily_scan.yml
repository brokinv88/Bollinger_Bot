name: Daily Crypto Portfolio Scanner

on:
  schedule:
    # 00:01 UTC = 07:01 Sáng giờ Việt Nam
    - cron: '1 0 * * *'
  workflow_dispatch:

# Cấp quyền đọc và ghi trực tiếp từ trong file workflow
permissions:
  contents: write

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy python-telegram-bot ccxt python-dotenv tabulate

      - name: Run Daily Scanner
        run: |
          python daily_scanner.py

      - name: Commit and Push Updated Databases
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add database_volume.db database_marketcap.db
          git diff --staged --quiet || (git commit -m "Update portfolio databases [skip ci]" && git push origin main)
